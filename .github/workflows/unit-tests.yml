name: Unit tests

# La puerta que faltaba.
#
# Hasta ahora la suite (≈630 tests JVM) SOLO corría en `gradle.yml`, con push a `main` y con tags — es
# decir, DESPUÉS de que el código ya estuviera en main. En un pull request únicamente corría CodeQL, que
# compila pero no ejecuta un solo test. Resultado: un PR se podía fusionar con la suite en rojo y el aviso
# llegaba cuando ya era main quien estaba roto (y había que lanzar `test-build` a mano para enterarse).
#
# Este workflow corre exactamente el mismo comando que la puerta de release, pero en el PR, que es donde
# todavía cuesta barato arreglarlo. No firma, no publica, no crea release y no toca `main`.
#
# Variante FOSS debug a propósito, igual que en gradle.yml: es JVM puro (sin Superpowered/native) y no
# necesita ningún secret — las claves caen a los defaults embebidos. Los tests de red de :innertube quedan
# fuera por diseño (no son deterministas), y los de sala en vivo se saltan solos sin `LT_LIVE_TEST=1`.

on:
  pull_request:
  workflow_dispatch:

# Solo leer el repositorio: este job ejecuta tests y sube un informe, no escribe nada en GitHub.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior: el resultado de un commit ya superado no
# sirve para nada y ocupa un runner.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-unittests-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-unittests-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests
        run: ./gradlew testUniversalFossDebugUnitTest --console=plain

      # Con el informe subido, un fallo se lee sin volver a ejecutar nada: qué test, qué esperaba y qué
      # recibió. `always()` porque el caso en que hace falta es justamente el del paso anterior en rojo.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testUniversalFossDebugUnitTest/
          retention-days: 7
