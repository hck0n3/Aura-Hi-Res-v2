name: Test Build (debug APK, no release)

# Private test build for verifying fixes on a real device.
# - Triggers ONLY on workflow_dispatch and pushes to test/** branches — NEVER on main.
# - Builds the arm64 GMS *debug* APK (auto-signed with the Android debug key; no release keystore needed).
# - Uploads the APK as a workflow artifact only.
# - Sends NO Discord/Telegram notifications and creates NO GitHub Release — it cannot reach the community.

on:
  workflow_dispatch:
    inputs:
      write_locks:
        # Plan, fase 2 (2026-10-07): after bumping versions in gradle/libs.versions.toml, regenerate every
        # gradle.lockfile with Gradle itself (never by hand) and commit them to THIS branch. Refused on
        # main. The agent's environment cannot reach Google Maven, so this runs here.
        description: 'Regenerar los gradle.lockfile y subirlos a esta rama (nunca main)'
        type: boolean
        default: false
      emulator_smoke:
        # Runs .github/workflows/emulator-smoke.yml (debug -Pnosub build on a GitHub emulator; artifacts only, no
        # release). Lives here because GitHub only dispatches workflow files that exist on the default branch.
        description: 'Ejecutar las pruebas en emulador (emulator-smoke.yml) en esta rama'
        type: boolean
        default: false
  push:
    branches:
      - 'test/**'

# Clonar el repo y nada más: este job compila y sube un artefacto, no escribe en el repositorio.
# Sin este bloque el job hereda el GITHUB_TOKEN con los permisos por defecto, que es más de lo que
# usa — la misma regla de CodeQL ("Workflow does not contain permissions") que señaló el workflow de
# los tests de sala en el PR #25.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Only when asked for with write_locks, and never on main. Writes ONLY the lockfiles, to the branch
  # that was dispatched; the test build below then runs on what was there before (its own checkout).
  # A push made with GITHUB_TOKEN starts no other workflow, so re-dispatch this one afterwards.
  write-locks:
    if: github.event_name == 'workflow_dispatch' && inputs.write_locks && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Ensure Android debug keystore (CI runner has none)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Regenerate every lockfile
        # resolveAndLockAll resolves every configuration of every project (all ABIs and variants); the
        # CI tasks then lock whatever only a real build resolves (lint, test platform, KSP). ONE variant
        # per Gradle invocation, exactly like the other workflows: Room exports its schema JSON to the
        # same app/schemas for every variant, and two KSP tasks in one run race on that file ("Expected
        # start of the object '{', but had 'EOF'").
        run: |
          ./gradlew resolveAndLockAll --write-locks --console=plain
          ./gradlew testUniversalFossDebugUnitTest --write-locks --console=plain
          ./gradlew assembleUniversalGmsDebug --write-locks --console=plain

      - name: Verify the new locks without --write-locks
        run: ./gradlew testUniversalFossDebugUnitTest --console=plain

      - name: Commit and push the lockfiles to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*gradle.lockfile'
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Regenerate dependency lockfiles (CI, --write-locks)"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

  emulator-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator_smoke && !inputs.write_locks
    permissions:
      contents: read
    uses: ./.github/workflows/emulator-smoke.yml

  test-build:
    if: github.event_name != 'workflow_dispatch' || (!inputs.write_locks && !inputs.emulator_smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-testbuild-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-testbuild-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests (quality gate)
        # FASE 17 (2026-08-24, súper auditoría): misma suite mínima de seguridad que en el
        # pipeline de release — 630 tests unitarios JVM deterministas. Un APK de prueba no debe
        # salir de una suite roja. Variante FOSS debug a propósito (JVM puro, sin secrets).
        run: ./gradlew testUniversalFossDebugUnitTest --console=plain

      # No google-services.json step: the GMS debug variant builds fine without it (verified), and
      # there is no GOOGLE_SERVICES_JSON secret — the step was dead and only produced an editor lint hint.

      - name: Ensure Android debug keystore (CI runner has none)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated standard Android debug keystore."
          fi

      # Private cloud (rows 886-887): the trimmed rclone executable for every ABI, same cache as the release build.
      - name: rclone inputs fingerprint
        id: rclone
        run: echo "stamp=$(scripts/build-rclone-android.sh --stamp)" >> "$GITHUB_OUTPUT"

      - name: Cache rclone executables
        id: rclone-cache
        uses: actions/cache@v6
        with:
          path: tools/rclone-android/out
          key: rclone-android-all-${{ steps.rclone.outputs.stamp }}

      - name: Set up Go for rclone
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/rclone-android/go.mod
          cache: false

      - name: Build rclone executables (librclone.so, every ABI)
        run: scripts/build-rclone-android.sh

      - name: Build universal GMS debug APK
        # Universal (all ABIs) so the test APK installs on EVERY device — phones, Android TV, car head
        # units and older 32-bit / x86 boxes — for verifying High-Performance Mode across form factors.
        env:
          # Debug builds are signed with the Android debug certificate, so the licence is embedded
          # UNBOUND here on purpose — binding it would leave every test build without an EQ. Without
          # the secret the test APK simply has no DSP engine and reports it on the EQ screen.
          SUPERPOWERED_LICENSE_KEY: ${{ secrets.SUPERPOWERED_LICENSE_KEY }}
        run: ./gradlew assembleUniversalGmsDebug --console=plain

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/test-artifacts
          APK=$(find app/build/outputs/apk/universalGms/debug -name "*.apk" | head -n 1)
          python3 scripts/rclone_android/rclone_android.py apk "$APK" arm64-v8a armeabi-v7a x86_64 x86
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          cp "$APK" "app/build/outputs/apk/test-artifacts/Aura-Hi-Res-TEST-${SHORT_SHA}.apk"
          echo "Test APK: Aura-Hi-Res-TEST-${SHORT_SHA}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aura-Hi-Res-TEST-debug
          path: app/build/outputs/apk/test-artifacts/*.apk
          retention-days: 14
