# Sonda de solo lectura (etapa 4 del arreglo semiautomático de YouTube): descarga reproductores YA resueltos a mano y muestra
# cómo están hechos, para escribir el extractor contra datos reales. No escribe nada ni avisa a nadie.
# (Relanzada tras corregir los permisos de Actions: el primer intento con el verificador no llegó a arrancar.)
name: Player probe

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/player_probe.py'
      - 'scripts/player_extract.py'
      - 'scripts/player_validate.py'
      - 'scripts/verify/**'
      - '.github/workflows/player-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd scripts/verify && npm install --no-audit --no-fund --silent
      - run: cd scripts && python3 player_validate.py 8 --verify
