name: Android Build & Sign

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      beta_tag:
        # Private-beta release from a manual run, for when the tag cannot be pushed with git (the
        # agent's environment only allows pushing its own branch). The release step creates the tag
        # on the commit being built. ONLY a tag containing "-beta" or "-test" is honoured, and it is
        # always published as a PRERELEASE — a stable release for every user can never come from here.
        description: 'Tag de beta privada a crear (ej. v2.0.61-beta9). Vacío = solo compilar.'
        required: false
        default: ''
      stable_tag:
        # STABLE release from a manual run — reaches EVERY user through the in-app updater, so it is
        # fenced three ways: only on `main`, never a -beta/-test tag, and the job FAILS before building
        # unless the tag is exactly "v" + versionName of the code being built. Only with the owner's
        # explicit order at that moment (AGENTS.md).
        description: 'Tag ESTABLE para todos (ej. v2.0.62). Solo en main y solo si coincide con versionName.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DISPATCH_BETA_TAG: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.beta_tag, 'v') && (contains(inputs.beta_tag, '-beta') || contains(inputs.beta_tag, '-test')) && inputs.beta_tag || '' }}
  DISPATCH_STABLE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.stable_tag, 'v') && !contains(inputs.stable_tag, '-') && inputs.stable_tag || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify stable tag matches versionName
        if: env.DISPATCH_STABLE_TAG != ''
        run: |
          VERSION_NAME=$(grep -m1 -E '^\s*versionName\s*=' app/build.gradle.kts | awk -F '"' '{print $2}')
          if [ "$DISPATCH_STABLE_TAG" != "v$VERSION_NAME" ]; then
            echo "::error::stable_tag=$DISPATCH_STABLE_TAG does not match versionName=$VERSION_NAME"
            exit 1
          fi
          echo "Stable release v$VERSION_NAME confirmed."

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-gms-universal-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-gms-universal-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests (quality gate)
        # FASE 17 (2026-08-24, súper auditoría): suite mínima de seguridad — 630 tests unitarios
        # JVM deterministas (sin red, sin dispositivo). Suite roja = no se construye ni firma
        # nada: el job falla aquí, ANTES de generar un APK. Corre la variante FOSS debug a
        # propósito: es JVM puro (sin Superpowered/native) y no necesita secrets — las claves
        # LASTFM/TIDAL/QOBUZ caen a los defaults embebidos documentados en app/build.gradle.kts
        # cuando el secret no está configurado. Los tests de red de :innertube quedan fuera por
        # diseño (no deterministas). El task imprime "N tests completed, M failed" solo si hay
        # fallos; un exit code != 0 de Gradle es lo que tumba este paso.
        run: ./gradlew testUniversalFossDebugUnitTest --console=plain

      - name: Create google-services.json
        # 2026-08-19: TEMPORARILY disabled. applicationId just changed (iad1tya.echo.music ->
        # iad1tya.aura.music) as part of the package-identity change to recover from what looks like
        # a YouTube-side block on the old package. The GOOGLE_SERVICES_JSON secret still only has a
        # Firebase app entry for the OLD package name — injecting it now would make the
        # com.google.gms.google-services plugin fail the build with "No matching client found for
        # package name 'iad1tya.aura.music'". Firebase (Analytics/Crashlytics) is a nice-to-have, not
        # required for playback, so the build proceeds without it rather than blocking on it.
        # RE-ENABLE (delete this `if: false` line) once the owner adds an Android app for
        # iad1tya.aura.music in the Firebase console and updates the GOOGLE_SERVICES_JSON secret.
        if: false
        env:
          HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf "%s" "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

      - name: Set up Signing Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore

      - name: Generate CI Keystore (fallback when no secrets configured)
        # Aura Hi-Res v2: emergency fallback identity. If RELEASE_KEYSTORE_BASE64 is missing the
        # build still succeeds but the APK is signed with this disposable cert — users would get
        # "app not installed" over any previous install. Detectable at a glance: the real v2
        # keystore is CN=Aura Hi-Res v2 (alias aurav2); this emergency one is CN=AURA-V2-EMERGENCY.
        run: |
          if [ ! -f app/keystore/release.keystore ]; then
            mkdir -p app/keystore
            keytool -genkeypair -v -keystore app/keystore/release.keystore \
              -storepass aurav2emergency -keypass aurav2emergency -alias aurav2 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AURA-V2-EMERGENCY, OU=Aura, O=Aura, L=NA, ST=NA, C=US"
            echo "Generated fallback CI keystore"
          fi

      - name: Build and Sign Release APK (Push to main / Dispatch / Tag)
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aurav2emergency' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aurav2' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aurav2emergency' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Paid Superpowered licence. Never in source. Release builds embed it XORed with the SHA-256
          # of the certificate that signs THIS build, so only an APK signed with our keystore can undo
          # it. When the secret is missing the build still succeeds — the shipped app simply has no DSP
          # engine and says so on the EQ screen (Gradle logs a warning).
          SUPERPOWERED_LICENSE_KEY: ${{ secrets.SUPERPOWERED_LICENSE_KEY }}
        # Plan B4 (row 331, owner approved 2026-10-07): the universal APK (every device) AND an arm64-only
        # APK (~46 MB instead of ~87) for modern phones. ONE variant per Gradle run: Room exports its schema
        # JSON to the same app/schemas for every variant, and two KSP tasks in one run race on that file.
        run: |
          ./gradlew assembleUniversalGmsRelease
          ./gradlew assembleArm64GmsRelease

      - name: Rename and Organize APKs
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          echo "App Version: $VERSION_NAME"
          mkdir -p app/build/outputs/apk/release-artifacts
          set -euo pipefail
          # NAMING CONTRACT (row 331): installed versions choose by NAME — an arm64 device takes the first
          # APK WITHOUT "universal", any other device the first WITH it. So the universal MUST contain
          # "universal" and the arm64 one must NEVER contain it, or a 32-bit TV is offered an APK it
          # cannot install.
          UNIVERSAL_APK=$(find app/build/outputs/apk/universalGms/release -name "*.apk" | head -n 1)
          ARM64_APK=$(find app/build/outputs/apk/arm64Gms/release -name "*.apk" | head -n 1)
          test -f "$UNIVERSAL_APK" && test -f "$ARM64_APK"
          cp "$UNIVERSAL_APK" "app/build/outputs/apk/release-artifacts/Aura-Hi-Res-v2-${VERSION_NAME}-universal.apk"
          cp "$ARM64_APK" "app/build/outputs/apk/release-artifacts/Aura-Hi-Res-v2-${VERSION_NAME}-arm64.apk"
          ls -l app/build/outputs/apk/release-artifacts/

      - name: Verify both APKs (same signer, same version, arm64 really arm64-only)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          D=app/build/outputs/apk/release-artifacts
          U=$(ls "$D"/*-universal.apk); A=$(ls "$D"/*-arm64.apk)
          CU=$("$BT/apksigner" verify --print-certs "$U" | grep -m1 'SHA-256')
          CA=$("$BT/apksigner" verify --print-certs "$A" | grep -m1 'SHA-256')
          echo "universal: $CU"; echo "arm64: $CA"
          [ "$CU" = "$CA" ] || { echo "::error::the two APKs are signed with different certificates"; exit 1; }
          VU=$("$BT/aapt2" dump badging "$U" | head -n1); VA=$("$BT/aapt2" dump badging "$A" | head -n1)
          [ "$VU" = "$VA" ] || { echo "::error::package/version differ: $VU vs $VA"; exit 1; }
          if unzip -l "$A" | grep ' lib/' | grep -vq ' lib/arm64-v8a/'; then
            echo "::error::the arm64 APK carries libraries for other ABIs"; exit 1
          fi
          echo "Both APKs verified: $VU"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aura-Hi-Res-v2
          path: app/build/outputs/apk/release-artifacts/*.apk

      # R8 mapping for deobfuscating user crash reports (obfuscated frames like `utils.s2.n` are
      # unreadable without the EXACT mapping of the shipped build — a local rebuild renames differently).
      - name: Upload R8 mapping (crash deobfuscation)
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/**/mapping.*
          if-no-files-found: warn

      - name: Parse Release Info
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # 1. Read first line and strip the "# " to get the Title
          TITLE=$(head -n 1 RELEASE_INFO.md | sed 's/^# //')
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV
          
          # 2. Read from line 3 onwards to get the Description body
          tail -n +3 RELEASE_INFO.md > release-body.md

      - name: Generate changelog.json
        if: startsWith(github.ref, 'refs/tags/v') || env.DISPATCH_BETA_TAG != '' || env.DISPATCH_STABLE_TAG != ''
        # Shared with the unit-tests gate (scripts/release_changelog.py): a bullet wrapped onto indented
        # lines is one item — the old inline parser kept only its first line, so the in-app Novedades
        # showed every wrapped bullet cut mid-sentence.
        run: |
          mkdir -p app/build/outputs/apk/release-artifacts
          python3 scripts/release_changelog.py RELEASE_INFO.md app/build/outputs/apk/release-artifacts/changelog.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || env.DISPATCH_BETA_TAG != '' || env.DISPATCH_STABLE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-body.md
          # Tag push: the pushed tag. Manual beta run: the validated beta_tag, created on this commit.
          tag_name: ${{ env.DISPATCH_BETA_TAG || env.DISPATCH_STABLE_TAG || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # PRIVATE BETA mechanism (owner order: test builds go only to him, never to everyone).
          # A tag containing "-beta" or "-test" is published as a PRERELEASE: GitHub excludes
          # prereleases from the `releases/latest` endpoint, which is exactly what the in-app
          # updater queries — so no user's app ever offers the beta. The owner installs it from
          # the release page directly. A normal `vX.Y.Z` tag behaves exactly as before.
          prerelease: ${{ env.DISPATCH_BETA_TAG != '' || contains(github.ref, '-beta') || contains(github.ref, '-test') }}
          files: |
            app/build/outputs/apk/release-artifacts/*.apk
            app/build/outputs/apk/release-artifacts/changelog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No-subscription test build. FOSS + a distinct applicationId (.dev), signed with the release
      # key. Built WITHOUT google-services.json (the .dev id isn't in it, which would fail the Google
      # plugin). Uploaded ONLY as a private build artifact (repo owner) — NEVER attached to the public
      # release, so it can't be used to bypass the paid subscription, and the updater never sees it.
      - name: Build No-Subscription Test APK
        if: startsWith(github.ref, 'refs/tags/v') || env.DISPATCH_BETA_TAG != '' || env.DISPATCH_STABLE_TAG != ''
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aurav2emergency' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aurav2' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aurav2emergency' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          SUPERPOWERED_LICENSE_KEY: ${{ secrets.SUPERPOWERED_LICENSE_KEY }}
        run: |
          rm -f app/google-services.json
          ./gradlew assembleArm64FossRelease -Pnosub=true
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          mkdir -p app/build/outputs/apk/nosub-artifacts
          find app/build/outputs/apk/arm64Foss/release -name "*.apk" | while read -r apk_path; do
            cp "$apk_path" "app/build/outputs/apk/nosub-artifacts/Aura-Hi-Res-v2-${VERSION_NAME}-NOSUB.apk"
            echo "No-sub APK: $apk_path"
          done

      - name: Upload No-Subscription Artifact (private, owner-only)
        if: startsWith(github.ref, 'refs/tags/v') || env.DISPATCH_BETA_TAG != '' || env.DISPATCH_STABLE_TAG != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Aura-Hi-Res-v2-NOSUB
          path: app/build/outputs/apk/nosub-artifacts/*.apk
