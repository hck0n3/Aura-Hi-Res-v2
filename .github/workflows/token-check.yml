name: Token check

# Diagnostic only: shows what the workflow token can really do in this repository, in seconds,
# instead of discovering it at the end of a 25-minute release build. Touches nothing that reaches
# users: it creates a DRAFT release and a throwaway non-"v" tag, and deletes both right away.
on:
  push:
    branches: [claude/cool-carson-qwc210]
    paths: ['.github/workflows/token-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Show token permissions and try a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          # remove the draft the first check left behind
          gh api -X DELETE "repos/$REPO/releases/429520271" 2>&1 | cut -c1-200 && echo "old draft removed"
          for T in zz-token-check v2.0.67-beta7; do
            echo "--- draft for $T at the beta 7 commit"
            OUT=$(gh api -X POST "repos/$REPO/releases" -f tag_name=$T -f target_commitish=859b19c785808e0574a1d718acf55c19feb7083e \
              -F draft=true -F prerelease=true -f name=token-check -f body="check" 2>&1)
            echo "$OUT" | cut -c1-250
            ID=$(echo "$OUT" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            [ -n "$ID" ] && gh api -X DELETE "repos/$REPO/releases/$ID" && echo "deleted draft $ID"
          done
          echo "--- existing releases (incl. drafts) mentioning beta7"
          gh api "repos/$REPO/releases?per_page=10" --jq '.[] | "\(.id) \(.tag_name) draft=\(.draft) pre=\(.prerelease)"' 2>&1 | cut -c1-200
          echo "--- tag refs"
          gh api "repos/$REPO/git/matching-refs/tags/v2.0.67" --jq '.[].ref' 2>&1 | cut -c1-200
